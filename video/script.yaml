  - id: reproducibility
    type: bullets
    kicker: "Reproducibility"
    heading: "Every number can be regenerated from the repository"
    bullets:
      - "Pre-registered: hypotheses H0–H10 committed before any code; every deviation logged"
      - "Every LLM call cached, keyed by a hash of model, prompt, seed and temperature"
      - "Every run logged turn by turn: prompt, raw response, parsed output, choice"
      - "Replay any LLM run byte-identically from the cache, with no API key and no cost"
      - "Re-analyse, replay, or re-run: three levels of reproduction"
    narration: >
      The hypotheses were committed before any code, and every deviation is logged. Every LLM call is
      cached and every run is logged, so anyone can replay a run with no API key and get a byte-identical log.

  - id: closing
    type: title
    kicker: "Code, logs, cache and pre-registration"
    title: "github.com/dhairya-pandya/AIAF-SwarmAlignment"
    subtitle: "Swarm Immunity: How Nature's Collectives Inspire Defences for Agentic AI"
    author: "Dhairya Pandya"
    affiliation: "IIITDM Jabalpur · Apart × AIAF Swarm Alignment Hackathon 2026"
    narration: >
      Code, logs and the response cache are open at the repository on screen. Thank you for watching.